services:
  db:
    image: postgres:16-alpine
    container_name: traceflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-traceflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceflow_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - traceflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceflow_user} -d ${POSTGRES_DB:-traceflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_api
    restart: unless-stopped
    profiles:
      - app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      GENERATOR_SEED: ${GENERATOR_SEED:-20261022}
      GENERATOR_PROFILE: ${GENERATOR_PROFILE:-starter}
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceflow_web
    restart: unless-stopped
    profiles:
      - app
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - traceflow_network
    depends_on:
      api:
        condition: service_healthy

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: traceflow_generator
    profiles:
      - tools
    environment:
      GENERATOR_SEED: ${GENERATOR_SEED:-20261022}
      GENERATOR_PROFILE: ${GENERATOR_PROFILE:-starter}
      ARTIFACTS_DIR: /app/artifacts
      SQL_DIR: /app/sql
    volumes:
      - ./artifacts:/app/artifacts
      - ./sql:/app/sql
    networks:
      - traceflow_network

  db-loader:
    image: postgres:16-alpine
    container_name: traceflow_db_loader
    profiles:
      - tools
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-traceflow_db}
      PGUSER: ${POSTGRES_USER:-traceflow_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-traceflow_secure_password}
    volumes:
      - ./sql:/app/sql:ro
      - ./artifacts:/app/artifacts:ro
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'Database loader ready. Will load schema.sql and seed.sql when triggered.'"]

  validator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_validator
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'Validator container ready.'"]

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_test
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
      - ./tests:/app/tests
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'Test runner container ready.'"]

volumes:
  pgdata:
    name: traceflow_pgdata

networks:
  traceflow_network:
    name: traceflow_net
    driver: bridge

