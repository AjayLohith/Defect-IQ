services:
  db:
    image: postgres:16-alpine
    container_name: traceflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-traceflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceflow_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - traceflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceflow_user} -d ${POSTGRES_DB:-traceflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_api
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      GENERATOR_SEED: ${GENERATOR_SEED:-20261022}
      GENERATOR_PROFILE: ${GENERATOR_PROFILE:-starter}
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - .:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceflow_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - traceflow_network
    depends_on:
      api:
        condition: service_healthy

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: traceflow_generator
    profiles:
      - tools
    environment:
      GENERATOR_SEED: ${GENERATOR_SEED:-20261022}
      GENERATOR_PROFILE: ${GENERATOR_PROFILE:-starter}
      ARTIFACTS_DIR: /app/artifacts
      SQL_DIR: /app/sql
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - traceflow_network

  db-loader:
    image: postgres:16-alpine
    container_name: traceflow_db_loader
    profiles:
      - tools
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-traceflow_db}
      PGUSER: ${POSTGRES_USER:-traceflow_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-traceflow_secure_password}
    volumes:
      - ./sql:/app/sql:ro
      - ./artifacts:/app/artifacts:ro
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "PGPASSWORD=$$PGPASSWORD psql -h db -U $$PGUSER -d $$PGDATABASE -f /app/sql/schema.sql && PGPASSWORD=$$PGPASSWORD psql -h db -U $$PGUSER -d $$PGDATABASE -f /app/sql/seed.sql && echo 'Schema and seed loaded.'"]

  validator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_validator
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      ARTIFACTS_DIR: /app/artifacts
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "generator.src.validator"]

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceflow_test
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceflow_user:traceflow_secure_password@db:5432/traceflow_db}
      ARTIFACTS_DIR: /app/artifacts
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - traceflow_network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["pytest"]

volumes:
  pgdata:
    name: traceflow_pgdata

networks:
  traceflow_network:
    name: traceflow_net
    driver: bridge

